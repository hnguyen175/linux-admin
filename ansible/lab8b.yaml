---
- name: creating groups and users
  hosts: lst2
  become: true

  vars_files:
    - groups.yaml
    - usrs.yaml
    - secrets.yaml

  tasks:
    - name: creating groups
      loop: "{{ managed_groups }}"
      ansible.builtin.group:
        name: "{{ item }}"
        state: present

    - name: adminjr passwd
      ansible.builtin.copy:
        src: ./adminjr
        dest: /etc/sudoers.d/adminjr

    - name: verify
      loop: "{{ managed_groups }}"
      ansible.builtin.getent:
        key: "{{ item }}"
        database: group
      changed_when: false

    - name: users and groups
      loop: "{{ usrs }}"
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: /bin/bash
        groups: "{{ item.groups }}"
        password: "{{ user_password | password_hash('sha512') }}"
        append: true
        state: present

    - name: verify users
      loop: "{{ usrs }}"
      ansible.builtin.command: "id {{item.name}}"
      changed_when: false


---
- name: Cp port
  hosts: linux
  become: true
  gather_facts: false

  tasks:
    - name: Copy to lst1
      ansible.builtin.copy:
        src: ./port_4222
        dest: /etc/ssh/sshd_config.d/port_4222.conf
        mode: "0644"
        owner: root
        group: root
      when: inventory_hostname == 'lst1'

    - name: Copy to lst2
      ansible.builtin.copy:
        src: ./port_4333
        dest: /etc/ssh/sshd_config.d/port_4333.conf
        mode: "0644"
        owner: root
        group: root
      when: inventory_hostname == 'lst2'

    - name: Restart sshd
      ansible.builtin.systemd_service:
        name: sshd
        state: restarted

---
- name: RM port file
  hosts: linux
  become: true
  gather_facts: false

  tasks:
    - name: Remove port file from lst1
      ansible.builtin.file:
        dest: /etc/ssh/sshd_config.d/port_4222
        state: absent
      when: inventory_hostname == 'lst1'

    - name: Remove port file from lst2
      ansible.builtin.file:
        dest: /etc/ssh/sshd_config.d/port_4333
        state: absent
      when: inventory_hostname == 'lst2'

    - name: Restart sshd
      ansible.builtin.systemd_service:
        name: sshd
        state: restarted

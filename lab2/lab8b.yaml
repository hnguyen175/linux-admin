---
- name: Creating groups and users
  hosts: lst2
  become: true
  gather_facts: false

  vars_files:
    - groups.yaml
    - usrs.yaml

  tasks:
    - name: Creating groups
      loop: "{{ managed_groups }}"
      ansible.builtin.group:
        name: "{{ item }}"
        state: present

    - name: Adminjr passwd
      ansible.builtin.copy:
        src: ./adminjr
        dest: /etc/sudoers.d/adminjr
        owner: root
        group: root
        mode: "0440"

    - name: Verify
      loop: "{{ managed_groups }}"
      ansible.builtin.getent:
        key: "{{ item }}"
        database: group
      changed_when: false

    - name: Users and groups
      loop: "{{ usrs }}"
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: /bin/bash
        groups: "{{ item.groups }}"
        password: "{{ item.name | password_hash('sha512') }}"
        append: true
        state: present

    - name: Verify users
      loop: "{{ usrs }}"
      ansible.builtin.command: "id {{ item.name }}"
      changed_when: false

# Run this for capture UFW/SSH logs
# sudo journalctl -k -n 0 -f -g '\[UFW (ALLOW|BLOCK)\].*DPT=4222([[:space:]]|$)'
---
- name: Install packages for lab 4
  hosts: linux
  become: true
  gather_facts: false

  vars_files:
    - packages.yaml

  tasks:
    - name: Install packages on lst1
      ansible.builtin.apt:
        name: "{{ packages_lst1 }}"
        update_cache: true
        state: present
      when: inventory_hostname == 'lst1'

    - name: Install packages on lst2
      ansible.builtin.apt:
        name: "{{ packages_lst2 }}"
        update_cache: true
        state: present
      when: inventory_hostname == 'lst2'

    - name: Install packages on lst-dhcp
      ansible.builtin.apt:
        name: "{{ packages_lst_dhcp }}"
        update_cache: true
        state: present
      when: inventory_hostname == 'lst-dhcp'

    - name: Set non-root capture option to YES
      ansible.builtin.debconf:
        name: wireshark-common
        question: wireshark-common/install-setuid
        vtype: boolean
        value: "true"

    - name: Reconfigure wireshark capture permission # noqa no-changed-when
      ansible.builtin.command: dpkg-reconfigure -f noninteractive wireshark-common

    - name: Add sysadmin to wireshark group
      ansible.builtin.user:
        name: sysadmin
        groups: wireshark
        append: true
        state: present

    - name: Allow ssh
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        log: true
        from: 192.168.122.0/24
      loop:
        - 4222
        - 9090
      when: inventory_hostname == 'lst1'

    - name: Deny ssh from 192.168.122.202
      community.general.ufw:
        rule: deny
        port: 4222
        proto: tcp
        log: true
        from: 192.168.122.202
        insert: 1
      when: inventory_hostname == 'lst1'

    - name: Activate ufw
      community.general.ufw:
        state: enabled
      when: inventory_hostname == 'lst1'

    - name: Verify ufw status # noqa: no-changed-when
      ansible.builtin.command: ufw status numbered
      register: ufw_status
      when: inventory_hostname == 'lst1'

    - name: Dump ufw status
      when: inventory_hostname == 'lst1'
      ansible.builtin.debug:
        var: ufw_status.stdout_lines

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Report if packages are installed on lst1
      ansible.builtin.debug:
        msg: "{{ item }} is installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst1'
        - "item in ansible_facts.packages"
      loop: "{{ packages_lst1 }}"

    - name: Report if packages are installed on lst2
      ansible.builtin.debug:
        msg: "{{ item }} is installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst2'
        - "item in ansible_facts.packages"
      loop: "{{ packages_lst2 }}"


    - name: Report if packages are installed on lst-dhcp
      ansible.builtin.debug:
        msg: "{{ item }} is installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst-dhcp'
        - "item in ansible_facts.packages"
      loop: "{{ packages_lst_dhcp }}"

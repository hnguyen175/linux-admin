---
- name: Install required packages for lst-dhcp
  hosts: lst-dhcp
  become: true
  gather_facts: false

  tasks:
    - name: Installed tshark
      ansible.builtin.apt:
        name: tshark
        state: present
        update_cache: true

    - name: Set non-root capture option to YES
      ansible.builtin.debconf:
        name: wireshark-common
        question: wireshark-common/install-setuid
        vtype: boolean
        value: 'true'

    - name: Reconfigure wireshark capture permission # noqa no-changed-when
      ansible.builtin.command: dpkg-reconfigure -f noninteractive wireshark-common

    - name: Add sysadmin to wireshark group
      ansible.builtin.user:
        name: sysadmin
        groups: wireshark
        append: true
        state: present

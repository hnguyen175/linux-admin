---
- name: UnInstall packages for lab 4
  hosts: linux
  become: true
  gather_facts: false

  vars_files:
    - packages.yaml

  tasks:
    # - name: Remove sysadmin from wireshark group
    #   ansible.builtin.user:
    #     name: sysadmin
    #     groups: wireshark
    #     state: absent

    - name: UnInstall packages on lst1
      ansible.builtin.apt:
        name: "{{ packages_lst1 }}"
        update_cache: true
        state: absent
      when: inventory_hostname == 'lst1'

    - name: UnInstall packages on lst2
      ansible.builtin.apt:
        name: "{{ packages_lst2 }}"
        update_cache: true
        state: absent
      when: inventory_hostname == 'lst2'

    - name: UnInstall packages on lst-dhcp
      ansible.builtin.apt:
        name: "{{ packages_lst_dhcp }}"
        update_cache: true
        state: absent
      when: inventory_hostname == 'lst-dhcp'

    - name: Purge packages
      ansible.builtin.apt:
        name: "{{ packages_topurge }}"
        update_cache: true
        state: absent
        purge: true

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Report if packages are not installed on lst1
      ansible.builtin.debug:
        msg: "{{ item }} is not installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst1'
        - "item not in ansible_facts.packages"
      loop: "{{ packages_lst1 }}"

    - name: Report if packages are not installed on lst2
      ansible.builtin.debug:
        msg: "{{ item }} is not installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst2'
        - "item not in ansible_facts.packages"
      loop: "{{ packages_lst2 }}"

    - name: Report if packages are not installed on lst-dhcp
      ansible.builtin.debug:
        msg: "{{ item }} is not installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst-dhcp'
        - "item not in ansible_facts.packages"
      loop: "{{ packages_lst_dhcp }}"

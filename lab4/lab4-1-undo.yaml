---
- name: UnInstall packages for lab 4
  hosts: linux
  become: true
  gather_facts: false

  vars_files:
    - services.yaml

  tasks:
    - name: UnInstall packages
      ansible.builtin.apt:
        name: "{{ services }}"
        update_cache: true
        state: absent
      when: inventory_hostname == 'lst1'

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Report if packages are not installed
      ansible.builtin.debug:
        msg: "{{ item }} is not installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst1'
        - "item not in ansible_facts.packages"
      loop: "{{ services }}"

    - name: ncat is not installed
      ansible.builtin.debug:
        msg: "ncat is not installed on {{ inventory_hostname }}"
      when:
        - inventory_hostname == 'lst1'
        - "'ncat' not in ansible_facts.packages"

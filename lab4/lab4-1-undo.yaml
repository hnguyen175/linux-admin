---
- name: UnInstall packages for lab 4
  hosts: lst1
  become: true
  gather_facts: false

  vars_files:
    - services.yaml

  tasks:
    - name: UnInstall packages
      ansible.builtin.apt:
        name: "{{ services }}"
        update_cache: true
        state: absent

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Report if packages are still installed
      ansible.builtin.debug:
        msg: "{{ item }} is not installed on {{ inventory_hostname }}"
      when: "item not in ansible_facts.packages"
      loop: "{{ services }}"
